---
######################################################
# /usr/bin/ansible-playbook \
#   playbooks/oc-mirror-create-disconnected.yaml \
#   -i inventory.yaml \
#   -e @vault/registry_secrets.yaml \
#   --vault-password-file \
#   .vault_password
######################################################

- name: Create Mirror
  hosts: disconnected_mirror
  tasks:
    - name: Check if the registry is up
      ansible.builtin.uri:
        url: https://{{ ansible_facts['fqdn'] }}:{{ registry_port }}/v2/
        validate_certs: false
        status_code:
          - 200
          - 401
      register: url_result
      failed_when: false

    - name: Install registry
      ansible.builtin.include_role:
        name: "../roles/oc-mirror"
        tasks_from: registry
      when: url_result.status | default(0) | int != 401

    - name: Populate Mirror
      ansible.builtin.include_role:
        name: "../roles/oc-mirror"
        tasks_from: disconnected-mirror
