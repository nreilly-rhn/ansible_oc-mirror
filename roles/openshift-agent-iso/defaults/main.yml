# SPDX-License-Identifier: MIT-0
---
# Workspace for installer binary, rendered configs, and generated ISO.
# Override in group_vars/openshift_agent_iso.yml.
openshift_agent_iso_workdir: /opt/openshift-agent-iso
# Persistent configs stay in workdir; copies under install/ are consumed by
# openshift-install agent create image --dir=.../install.
openshift_agent_iso_install_dir: "{{ openshift_agent_iso_workdir }}/install"

# Release image used to extract openshift-install (disconnected Quay / mirror).
openshift_version: 4.22.4
# oc-mirror v2 maps quay.io/.../ocp-release → <mirror>/openshift/release-images
openshift_release_image: >-
  {{ openshift_mirror_registry }}/openshift/release-images:{{
    openshift_version }}-x86_64

# Seed auth (assert / vault). install-config pullSecret is rebuilt as
# mirror-only JSON from podman login (~/.dockercfg).
openshift_pull_secret: "{{ redhat_pull_secret | default('') }}"
openshift_pull_secret_file: "{{ openshift_agent_iso_workdir }}/mirror-auth.json"

# Path to oc binary (use system oc, or oc from oc-mirror workspace).
openshift_oc_bin: oc

# Cluster topology is detected from openshift_hosts length:
#   1 host  → sno     (1 master, platform none)
#   3 hosts → compact (3 masters, platform baremetal)
#   5+ hosts → ha     (3 masters + workers, platform baremetal)
#   2 or 4 hosts → invalid (role fails with an error)
# openshift_topology is set at runtime; do not set it manually.
openshift_topology: ""

# install-config.yaml
openshift_cluster_name: sno
openshift_base_domain: lab.naramajac.xyz
openshift_ssh_key: ""
openshift_fips: false
openshift_network_type: OVNKubernetes
# Derived at runtime from host addresses with role: node (see
# tasks/derive-machine-network.yaml). Set
# openshift_machine_network_from_hosts: false and populate this list to
# override.
openshift_machine_network: []
openshift_machine_network_from_hosts: true
openshift_cluster_network:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
openshift_service_network:
  - 172.30.0.0/16

# Platform VIPs (required for baremetal / compact / ha; ignored for sno/none).
openshift_api_vips: []
openshift_ingress_vips: []

# Disconnected mirror — required for install-config.yaml.
# Host:port of the internal Quay / mirror-registry (no scheme).
openshift_mirror_registry: registry-int.lab.naramajac.xyz:8443

# Prefer IDMS generated by oc-mirror (working-dir/cluster-resources).
# Set openshift_image_digest_sources_force: true to skip IDMS auto-load and
# use openshift_image_digest_sources (or the defaults below) only.
openshift_oc_mirror_workdir: "{{ oc_mirror_workdir | default('/opt/oc-mirror') }}"
openshift_oc_mirror_cluster_resources: >-
  {{ openshift_oc_mirror_workdir }}/working-dir/cluster-resources
openshift_image_digest_sources_force: false
openshift_image_digest_sources: []

# Used when no IDMS files are found and openshift_image_digest_sources is empty.
# Paths match oc-mirror v2 layout (see idms-oc-mirror.yaml).
openshift_image_digest_sources_default:
  - source: quay.io/openshift-release-dev/ocp-release
    mirrors:
      - "{{ openshift_mirror_registry }}/openshift/release-images"
  - source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
    mirrors:
      - "{{ openshift_mirror_registry }}/openshift/release"
  - source: registry.redhat.io
    mirrors:
      - "{{ openshift_mirror_registry }}"

# PEM for additionalTrustBundle. Inline value wins; otherwise the role
# fetches the TLS cert/chain from openshift_mirror_registry via
# community.crypto.get_certificate (delegated to localhost).
openshift_additional_trust_bundle: ""
openshift_mirror_ca_file: "{{ openshift_agent_iso_workdir }}/mirror-ca.crt"

# agent-config.yaml
# If empty, rendezvousIP defaults to the first host ipv4.address.
openshift_rendezvous_ip: ""

# Host definitions (SNO: one master; compact: three masters).
# See README for ethernet / multi-NIC / bond examples.
# openshift_hosts: []
# Example (single NIC):

# ---------------------------------------------------------------------------
# SNO example — Simple networking:
#   eno1 → 172.16.1.0/23   (gw 1.254, dns 0.254)
# ---------------------------------------------------------------------------
openshift_hosts_sno: &openshift_hosts_sno
  - hostname: master-0
    role: master
    root_device_name: /dev/vda
    interfaces:
      - name: enp1s0
        mac_address: "52:54:00:00:00:10"
    network_config:
      ipv4:
        interface: enp1s0
        address: 172.16.0.230
        prefix_length: 23
      dns_resolver:
        - 172.16.0.254
      routes:
        - destination: 0.0.0.0/0
          next_hop_address: 172.16.1.254

# ---------------------------------------------------------------------------
# Compact example — complex networking per host:
#   4 ethernet NICs, 2 bonds, VLAN 100 on bond0
#   bond0.100 → 172.16.1.0/24   (gw .254, dns .253)
#   bond1     → 10.254.224.0/24 (gw .254, dns .253)
#   MAC prefix: 52:54:01
# ---------------------------------------------------------------------------
openshift_hosts_compact: &openshift_hosts_compact
  - hostname: master-0.lab.naramajac.xyz
    role: master
    root_device_name: /dev/sda
    interfaces:
      - name: eno1
        mac_address: "52:54:01:00:00:11"
      - name: eno2
        mac_address: "52:54:01:00:00:12"
      - name: eno3
        mac_address: "52:54:01:00:00:13"
      - name: eno4
        mac_address: "52:54:01:00:00:14"
    network_config:
      ipv4_addresses:
        - interface: bond0.100
          address: 172.16.1.226
          prefix_length: 24
          role: node
        - interface: bond1
          address: 10.254.224.226
          prefix_length: 24
          role: storage
      bonds:
        - name: bond0
          mode: active-backup
          ports:
            - eno1
            - eno2
          primary: eno1
          miimon: "100"
        - name: bond1
          mode: 802.3ad
          ports:
            - eno3
            - eno4
          miimon: "100"
      vlans:
        - name: bond0.100
          id: 100
          base_iface: bond0
      dns_resolver:
        - 172.16.1.253
        - 10.254.224.253
      # Dual default routes need separate tables + source-based route-rules
      # so replies egress the interface that owns the source IP.
      routes:
        - destination: "0.0.0.0/0"
          next_hop_address: 172.16.1.254
          next_hop_interface: bond0.100
          table_id: 100
        - destination: "0.0.0.0/0"
          next_hop_address: 10.254.224.254
          next_hop_interface: bond1
          table_id: 101
      route_rules:
        - ip_from: 172.16.1.226/32
          route_table: 100
          priority: 1000
        - ip_from: 10.254.224.226/32
          route_table: 101
          priority: 1001
  - hostname: master-1.lab.naramajac.xyz
    role: master
    root_device_name: /dev/sda
    interfaces:
      - name: eno1
        mac_address: "52:54:01:00:00:21"
      - name: eno2
        mac_address: "52:54:01:00:00:22"
      - name: eno3
        mac_address: "52:54:01:00:00:23"
      - name: eno4
        mac_address: "52:54:01:00:00:24"
    network_config:
      ipv4_addresses:
        - interface: bond0.100
          address: 172.16.1.227
          prefix_length: 24
          role: node
        - interface: bond1
          address: 10.254.224.227
          prefix_length: 24
          role: storage
      bonds:
        - name: bond0
          mode: active-backup
          ports:
            - eno1
            - eno2
          primary: eno1
          miimon: "100"
        - name: bond1
          mode: 802.3ad
          ports:
            - eno3
            - eno4
          miimon: "100"
      vlans:
        - name: bond0.100
          id: 100
          base_iface: bond0
      dns_resolver:
        - 172.16.1.253
        - 10.254.224.253
      routes:
        - destination: "0.0.0.0/0"
          next_hop_address: 172.16.1.254
          next_hop_interface: bond0.100
          table_id: 100
        - destination: "0.0.0.0/0"
          next_hop_address: 10.254.224.254
          next_hop_interface: bond1
          table_id: 101
      route_rules:
        - ip_from: 172.16.1.227/32
          route_table: 100
          priority: 1000
        - ip_from: 10.254.224.227/32
          route_table: 101
          priority: 1001
  - hostname: master-2.lab.naramajac.xyz
    role: master
    root_device_name: /dev/sda
    interfaces:
      - name: eno1
        mac_address: "52:54:01:00:00:31"
      - name: eno2
        mac_address: "52:54:01:00:00:32"
      - name: eno3
        mac_address: "52:54:01:00:00:33"
      - name: eno4
        mac_address: "52:54:01:00:00:34"
    network_config:
      ipv4_addresses:
        - interface: bond0.100
          address: 172.16.1.228
          prefix_length: 24
          role: node
        - interface: bond1
          address: 10.254.224.228
          prefix_length: 24
          role: storage
      bonds:
        - name: bond0
          mode: active-backup
          ports:
            - eno1
            - eno2
          primary: eno1
          miimon: "100"
        - name: bond1
          mode: 802.3ad
          ports:
            - eno3
            - eno4
          miimon: "100"
      vlans:
        - name: bond0.100
          id: 100
          base_iface: bond0
      dns_resolver:
        - 172.16.1.253
        - 10.254.224.253
      routes:
        - destination: "0.0.0.0/0"
          next_hop_address: 172.16.1.254
          next_hop_interface: bond0.100
          table_id: 100
        - destination: "10.254.224.0/24"
          next_hop_address: 10.254.224.254
          next_hop_interface: bond1
          table_id: 101
      route_rules:
        - ip_from: 172.16.1.228/32
          route_table: 100
          priority: 1000
        - ip_from: 10.254.224.228/32
          route_table: 101
          priority: 1001

openshift_hosts:
  *openshift_hosts_compact

force_openshift_install_extract: false
