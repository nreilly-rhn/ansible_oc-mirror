---
- name: Check for oc-mirror binary
  ansible.builtin.stat:
    path: "{{ oc_mirror_workdir }}/oc-mirror"
  register: oc_mirror_binary

- name: Ensure OpenShift client is correct
  ansible.builtin.command:
    chdir: "{{ oc_mirror_workdir }}"
    argv:
      - "{{ oc_mirror_workdir }}/oc"
      - --version
      - --client=false
      - --output=json
  register: oc_version
  changed_when: false
  failed_when: oc_version.rc != 0 or (openshift_version not in oc_version.stdout.releaseClientVersion)
  ignore_errors: true

- name: Remove oc-mirror binary if OpenShift client is incorrect
  when: oc_version is defined and oc_version.rc == 0
  ansible.builtin.file:
    path: "{{ oc_mirror_workdir }}/{{ item }}"
    state: absent
  with_items:
    - oc-mirror
    - oc
    - kubectl
    - openshift-install

- name: Download and install OpenShift binaries
  when: not oc_mirror_binary.stat.exists or openshift_version not in oc_version.stdout.releaseClientVersion
  block:
    - name: Download OpenShift client archives
      ansible.builtin.uri:
        url: https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{ openshift_version }}/{{ item }}.tar.gz
        dest: /var/tmp/
      loop:
        - oc-mirror
        - openshift-client-linux
        - openshift-install-linux

    - name: Extract binaries
      ansible.builtin.unarchive:
        src: /var/tmp/{{ item }}.tar.gz
        dest: "{{ oc_mirror_workdir }}/"
        remote_src: true
        mode: "0755"
        exclude:
          - README.md
      loop:
        - oc-mirror
        - openshift-client-linux
        - openshift-install-linux

    - name: Cleanup the tarballs
      ansible.builtin.file:
        path: /var/tmp/{{ item }}.tar.gz
        state: absent
      loop:
        - oc-mirror
        - openshift-client-linux
        - openshift-install-linux

- name: Download the mirror-registry binary
  ansible.builtin.get_url:
    url: "{{ mirror_registry_url }}"
    dest: "{{ oc_mirror_workdir }}/mirror-registry.tar.gz"
    mode: "0644"
