---
# Connected mirrorToDisk for the CNCF Distribution path.
#
# oc-mirror does not talk to the local registry on this host. Before the
# transfer archive is packed, registry-save-image.yaml pulls registry:3
# and writes oc_mirror_workdir/registry.tar so the disconnected host can
# load the image without docker.io.
#
# The archive is rebuilt when the ImageSet changes, when force_oc_mirror
# is set, when the transfer archive is missing, or when the registry
# image tar is newer than the transfer archive.

- name: Create oc-mirror workspace
  become: true
  ansible.builtin.file:
    path: "{{ oc_mirror_workdir }}"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user | default(omit) }}"
    group: "{{ ansible_user | default(omit) }}"

- name: Install OpenShift binaries
  ansible.builtin.include_tasks:
    file: install-oc-binaries.yaml

- name: Copy ImageSetConfiguration
  ansible.builtin.template:
    src: ImageSetConfiguration.yaml.j2
    dest: "{{ oc_mirror_workdir }}/ImageSetConfiguration.yaml"
    mode: "0644"
  register: mirror_config

- name: Create Red Hat pull secret
  ansible.builtin.copy:
    dest: "{{ oc_mirror_workdir }}/redhat-auth.json"
    content: "{{ redhat_pull_secret }}"
    mode: "0600"

- name: Clean up previous oc-mirror workspace and archive
  when: mirror_config.changed or (force_oc_mirror | default(false) | bool)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ oc_mirror_workdir }}/working-dir"
    - "{{ oc_mirror_archive_path }}"

- name: Run oc-mirror - Mirror to Disk
  when: mirror_config.changed or (force_oc_mirror | default(false) | bool)
  ansible.builtin.command:
    chdir: "{{ oc_mirror_workdir }}"
    argv:
      - ./oc-mirror
      - --v2
      - --config
      - ImageSetConfiguration.yaml
      - --authfile
      - redhat-auth.json
      - file://{{ oc_mirror_workdir }}
  register: mirror_task
  async: 7200
  poll: 60
  retries: 10
  delay: 10
  changed_when: mirror_task.rc == 0
  until: mirror_task is not failed

- name: Download cincinatti update graph-data for disconnected clusters
  ansible.builtin.get_url:
    url: https://api.openshift.com/api/upgrades_info/graph-data
    dest: "{{ oc_mirror_workdir }}/cincinnati-graph-data.tar.gz"
    mode: "0644"

- name: Save the CNCF Distribution registry image for transfer
  ansible.builtin.include_tasks:
    file: registry-save-image.yaml

- name: Check the saved registry image
  ansible.builtin.stat:
    path: "{{ registry_image_archive }}"
  register: registry_image_tar

- name: Check the transfer archive
  ansible.builtin.stat:
    path: "{{ oc_mirror_archive_path }}"
  register: registry_transfer_archive

- name: Create a tarball for transfer
  when: >-
    mirror_config.changed
    or (force_oc_mirror | default(false) | bool)
    or not registry_transfer_archive.stat.exists
    or (
      registry_image_tar.stat.exists
      and registry_image_tar.stat.mtime
      > (registry_transfer_archive.stat.mtime | default(0))
    )
  community.general.archive:
    path:
      - "{{ oc_mirror_workdir }}"
    exclude_path:
      - "{{ oc_mirror_workdir }}/working-dir"
      - "{{ oc_mirror_workdir }}/redhat-auth.json"
    mode: "0664"
    format: tar
    dest: "{{ oc_mirror_archive_path }}"
  async: 7200
  poll: 60
